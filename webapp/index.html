<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
</head>
<body>
<title>CORTEX — Ma Mémoire</title>
<style>
  :root{
    --bg:#faf7f2; --bg-2:#fffdf9; --surface:#fff; --surface-2:#f5f1ea; --surface-3:#efe9df;
    --line:#eae3d7; --line-2:#dbd1c0; --ink:#1a1714; --ink-2:#403930; --muted:#8a8175; --soft:#a89f90;
    --amber:#f59e0b; --amber-2:#ffb43d; --amber-deep:#b9760a; --amber-soft:rgba(245,158,11,.12); --amber-ring:rgba(245,158,11,.36);
    --violet:#7c5cff; --violet-2:#9a80ff; --violet-deep:#5b45c4; --violet-soft:rgba(124,92,255,.12); --violet-ring:rgba(124,92,255,.34);
    --teal:#0d9488; --teal-deep:#0b7268; --teal-soft:rgba(13,148,136,.12); --teal-ring:rgba(13,148,136,.32);
    --blue:#2f73e8; --blue-deep:#1f54b0; --blue-soft:rgba(47,115,232,.12); --blue-ring:rgba(47,115,232,.3);
    --rose:#e05299; --rose-deep:#b03a75; --rose-soft:rgba(224,82,153,.12); --rose-ring:rgba(224,82,153,.32);
    --green:#16a34a; --green-soft:rgba(22,163,74,.1); --red:#dc2626; --red-soft:rgba(220,38,38,.1);
    --shadow-1:0 1px 0 rgba(255,255,255,.8) inset, 0 6px 20px rgba(60,45,20,.06);
    --shadow-2:0 1px 0 rgba(255,255,255,.8) inset, 0 22px 50px rgba(60,45,20,.13);
    --r:18px; --r-lg:24px; --r-xl:30px;
    --sans:"Segoe UI Variable Display","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Inter",Arial,sans-serif;
    --mono:ui-monospace,"Cascadia Code","Consolas","JetBrains Mono",Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:radial-gradient(circle at 9% -6%,rgba(245,158,11,.11) 0,transparent 38%),radial-gradient(circle at 96% 6%,rgba(124,92,255,.10) 0,transparent 40%),var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
  button,input,textarea,select{font:inherit;color:inherit}
  button{cursor:pointer;border:0;background:transparent}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  ::selection{background:var(--violet-soft)}
  .shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}

  .side{position:sticky;top:0;height:100vh;background:linear-gradient(180deg,#fff,var(--bg-2));border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:14px;overflow:auto;z-index:30}
  .side::-webkit-scrollbar{width:6px}.side::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:3px}
  .brand{display:flex;align-items:center;gap:12px;padding:4px 6px 16px;border-bottom:1px solid var(--line)}
  .brand .mark{width:40px;height:40px;border-radius:13px;flex:none;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,var(--amber-2),var(--amber) 60%,var(--violet-deep) 165%);box-shadow:0 8px 18px rgba(124,92,255,.32),0 1px 0 rgba(255,255,255,.4) inset;position:relative}
  .brand .mark svg{width:22px;height:22px;color:#fff}
  .brand .mark::after{content:"";position:absolute;inset:-4px;border-radius:16px;border:1.5px solid var(--violet-ring);opacity:.55;animation:halo 2.6s ease-in-out infinite}
  @keyframes halo{0%,100%{transform:scale(1);opacity:.55}50%{transform:scale(1.14);opacity:0}}
  .brand .wm{font-size:22px;font-weight:900;letter-spacing:-1.2px;line-height:.9}
  .brand .sub{font-size:9.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--violet-deep);margin-top:4px}
  .nav{display:flex;flex-direction:column;gap:3px}
  .nav button{display:grid;grid-template-columns:28px 1fr;gap:11px;align-items:center;padding:9px 11px;border-radius:12px;color:var(--ink-2);font-weight:600;font-size:13.5px;letter-spacing:-.01em;transition:.13s;width:100%;text-align:left}
  .nav button i{font-style:normal;display:grid;place-items:center;width:28px;height:28px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
  .nav button i svg{width:16px;height:16px}
  .nav button:hover{background:var(--surface-2);color:var(--ink)}
  .nav button:hover i{color:var(--violet);border-color:var(--violet-ring)}
  .nav button.active{background:linear-gradient(180deg,var(--amber-soft),rgba(245,158,11,.03));color:var(--amber-deep);font-weight:750;border:1px solid var(--amber-ring)}
  .nav button.active i{background:linear-gradient(135deg,var(--amber-2),var(--amber));color:#fff;border-color:transparent;box-shadow:0 6px 15px rgba(245,158,11,.42)}
  .side-spacer{flex:1}
  .principle{padding:13px;border-radius:16px;border:1px solid var(--line);background:linear-gradient(180deg,#fff,#fffdf8);box-shadow:var(--shadow-1)}
  .principle .tag{display:inline-block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:var(--violet-deep);background:var(--violet-soft);border:1px solid var(--violet-ring);padding:3px 7px;border-radius:5px}
  .principle b{display:block;font-size:12px;margin-top:8px;color:var(--ink);line-height:1.35;font-weight:750}
  .principle p{margin:5px 0 0;font-size:11px;color:var(--muted);line-height:1.45}
  .side-user{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
  .avatar{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--amber-2),var(--violet));color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;box-shadow:0 4px 10px rgba(124,92,255,.3)}
  .side-user b{font-size:12.5px;font-weight:750}.side-user span{display:block;color:var(--muted);font-size:10.5px;margin-top:1px}
  .syncline{font-size:10.5px;font-weight:700;color:var(--muted);padding:7px 10px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);text-align:center}
  .syncline.ok{color:var(--green);background:var(--green-soft);border-color:rgba(22,163,74,.25)}
  .syncline.err{color:var(--red);background:var(--red-soft);border-color:rgba(220,38,38,.25)}

  main{padding:24px 30px 130px;max-width:1280px;width:100%;margin:0 auto}
  .page-head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:18px;flex-wrap:wrap}
  .eyebrow{display:inline-flex;align-items:center;gap:7px;font-size:10.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--violet-deep)}
  .eyebrow::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--violet);box-shadow:0 0 0 0 var(--violet-ring);animation:pulse 1.8s ease-out infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(124,92,255,.5)}80%,100%{box-shadow:0 0 0 8px rgba(124,92,255,0)}}
  h1{font-size:30px;letter-spacing:-1.4px;line-height:1.04;margin:7px 0 4px;font-weight:850}
  .lead{margin:0;color:var(--muted);font-size:13.5px;max-width:680px}
  .head-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .mobile-burger{display:none}
  .btn{display:inline-flex;align-items:center;gap:7px;border-radius:12px;padding:10px 15px;font-weight:750;font-size:13px;letter-spacing:-.01em;transition:.13s}
  .btn svg{width:16px;height:16px}
  .btn.primary{background:linear-gradient(135deg,var(--amber-2),var(--amber));color:#fff;box-shadow:0 8px 20px rgba(245,158,11,.34),0 1px 0 rgba(255,255,255,.3) inset}
  .btn.primary:hover{transform:translateY(-1px);box-shadow:0 13px 28px rgba(245,158,11,.46),0 1px 0 rgba(255,255,255,.3) inset}
  .btn.violet{background:linear-gradient(135deg,var(--violet-2),var(--violet));color:#fff;box-shadow:0 8px 20px rgba(124,92,255,.32),0 1px 0 rgba(255,255,255,.25) inset}
  .btn.violet:hover{transform:translateY(-1px)}
  .btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line-2)}
  .btn.ghost:hover{background:var(--surface-2);border-color:var(--violet-ring);color:var(--violet-deep)}
  .btn.sm{padding:8px 12px;font-size:12.5px;border-radius:10px}
  .view{animation:viewin .42s cubic-bezier(.22,.61,.36,1) both}
  @keyframes viewin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  /* mode calme : pendant la frappe/filtrage, RIEN ne bouge (exigence Abbas) */
  .view.quiet{animation:none}
  .view.quiet .mem,.view.quiet .synmap{animation:none}
  /* mode chat verrouillé façon WhatsApp : la page ne scrolle JAMAIS, seuls les messages défilent */
  body.chatlock{overflow:hidden;height:100vh;height:100dvh}
  body.chatlock main{height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column;padding-bottom:14px}
  body.chatlock .view{flex:1;min-height:0;display:flex;flex-direction:column;animation:none}
  body.chatlock .page-head{margin-bottom:8px;flex:none}
  body.chatlock .lead{display:none}
  body.chatlock .aiwrap{flex:1;min-height:0;height:auto!important}

  .hero{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;margin-bottom:24px}
  .synwrap{position:relative;background:radial-gradient(ellipse at 50% 45%,rgba(124,92,255,.07) 0,transparent 60%),linear-gradient(180deg,#fff,var(--bg-2));border:1px solid var(--line);border-radius:var(--r-xl);overflow:hidden;padding:18px;box-shadow:var(--shadow-1)}
  .synwrap .sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:2px}
  .syn-tag{display:inline-flex;align-items:center;gap:7px;font-size:10.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--violet-deep);background:var(--violet-soft);border:1px solid var(--violet-ring);padding:5px 11px;border-radius:999px}
  .live{display:inline-flex;align-items:center;gap:6px;color:var(--green);font-weight:750;text-transform:uppercase;letter-spacing:.08em;font-size:10px}
  .live i{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 8px rgba(22,163,74,.6);animation:blink 1.5s ease-out infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
  .synmap{width:100%;height:auto;display:block;animation:mapin .7s ease both}
  @keyframes mapin{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
  .syn-link{stroke:var(--violet);stroke-width:1.5;opacity:.26;stroke-dasharray:4 6;animation:flow 3.4s linear infinite;filter:drop-shadow(0 0 3px rgba(124,92,255,.4))}
  @keyframes flow{to{stroke-dashoffset:-20}}
  .syn-node{cursor:pointer}
  .syn-node .halo{transform-box:fill-box;transform-origin:center;animation:syn 3.2s ease-in-out infinite var(--d)}
  @keyframes syn{0%,100%{opacity:.16;transform:scale(1)}50%{opacity:.34;transform:scale(1.18)}}
  .syn-node .dot{stroke:#fff;stroke-width:2;transition:.15s}
  .syn-node.amber .dot{fill:var(--amber);filter:drop-shadow(0 0 7px rgba(245,158,11,.6))}.syn-node.amber .halo{fill:var(--amber)}
  .syn-node.violet .dot{fill:var(--violet);filter:drop-shadow(0 0 7px rgba(124,92,255,.6))}.syn-node.violet .halo{fill:var(--violet)}
  .syn-node.teal .dot{fill:var(--teal);filter:drop-shadow(0 0 7px rgba(13,148,136,.55))}.syn-node.teal .halo{fill:var(--teal)}
  .syn-node.blue .dot{fill:var(--blue);filter:drop-shadow(0 0 7px rgba(47,115,232,.55))}.syn-node.blue .halo{fill:var(--blue)}
  .syn-node.rose .dot{fill:var(--rose);filter:drop-shadow(0 0 7px rgba(224,82,153,.55))}.syn-node.rose .halo{fill:var(--rose)}
  .syn-node .lbl{font-family:var(--sans);font-size:9.5px;font-weight:700;fill:var(--ink-2);text-anchor:middle;pointer-events:none}
  .syn-node:hover .dot{transform:scale(1.25);transform-box:fill-box;transform-origin:center}
  .synmap.focus .syn-node{opacity:.25;transition:opacity .15s}
  .synmap.focus .syn-node.hot{opacity:1}
  .synmap.focus .syn-link{opacity:.05}
  .synmap.focus .syn-link.hot{opacity:.75}
  .synmap-empty{text-align:center;padding:50px 20px;color:var(--muted)}
  .synmap-empty svg{width:44px;height:44px;color:var(--violet);opacity:.5;margin-bottom:10px}
  .syn-legend{display:flex;gap:14px;justify-content:center;margin-top:4px;font-size:10.5px;color:var(--muted);font-weight:600;flex-wrap:wrap}
  .syn-legend span{display:inline-flex;align-items:center;gap:5px}
  .syn-legend i{width:9px;height:9px;border-radius:50%}
  .syn-legend i.a{background:var(--amber)}.syn-legend i.v{background:var(--violet)}.syn-legend i.t{background:var(--teal)}.syn-legend i.b{background:var(--blue)}.syn-legend i.p{background:var(--rose)}

  .hero-side{display:flex;flex-direction:column;gap:14px}
  .statcard{background:linear-gradient(180deg,#fff,var(--bg-2));border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow-1)}
  .statcard .big{font-size:44px;line-height:.9;font-weight:900;letter-spacing:-2.5px;font-variant-numeric:tabular-nums;background:linear-gradient(135deg,var(--amber-deep),var(--violet-deep));-webkit-background-clip:text;background-clip:text;color:transparent}
  .statcard .biglbl{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:2px}
  .statcard .row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
  .statcard .mini{background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:9px 10px;cursor:pointer;transition:.13s}
  .statcard .mini:hover{border-color:var(--violet-ring)}
  .statcard .mini .v{font-size:19px;font-weight:850;letter-spacing:-.8px;font-variant-numeric:tabular-nums}
  .statcard .mini.h .v{color:var(--amber-deep)}.statcard .mini.c .v{color:var(--violet-deep)}.statcard .mini.i .v{color:var(--teal-deep)}.statcard .mini.d .v{color:var(--blue-deep)}.statcard .mini.p .v{color:var(--rose-deep)}
  .statcard .mini .k{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-top:2px}
  .importcard{background:linear-gradient(135deg,#fff8ef,#f3ecff);border:1px solid var(--violet-ring);border-radius:var(--r-lg);padding:16px 17px;box-shadow:var(--shadow-1)}
  .importcard .t{font-size:13.5px;font-weight:800;margin-bottom:3px;display:flex;align-items:center;gap:7px}
  .importcard p{margin:0 0 12px;font-size:11.5px;color:var(--ink-2);line-height:1.45}

  .bar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
  .search{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line-2);border-radius:12px;padding:9px 13px;min-width:230px;flex:1;max-width:340px;box-shadow:var(--shadow-1)}
  .search svg{width:16px;height:16px;color:var(--muted)}.search input{border:0;outline:0;background:none;width:100%;font-size:13.5px}
  .chips{display:flex;gap:7px;flex-wrap:wrap}
  .chip{padding:8px 13px;border-radius:999px;font-size:12.5px;font-weight:700;color:var(--ink-2);background:var(--surface);border:1px solid var(--line-2);transition:.13s}
  .chip:hover{border-color:var(--violet-ring);color:var(--violet-deep)}
  .chip.active{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .chip .n{opacity:.55;margin-left:5px;font-variant-numeric:tabular-nums}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:15px}
  .mem{position:relative;background:linear-gradient(180deg,#fff,var(--bg-2));border:1px solid var(--line);border-radius:var(--r-lg);padding:17px 18px;box-shadow:var(--shadow-1);display:flex;flex-direction:column;gap:9px;transition:.16s;overflow:hidden;animation:rise .45s cubic-bezier(.22,.61,.36,1) both}
  .mem::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;opacity:0;transition:.2s}
  .mem.h::before{background:var(--amber)} .mem.c::before{background:var(--violet)} .mem.i::before{background:var(--teal)} .mem.d::before{background:var(--blue)} .mem.p::before{background:var(--rose)}
  .mem:hover{transform:translateY(-3px);box-shadow:var(--shadow-2)}
  .mem:hover::before{opacity:1}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .mem .r1{display:flex;align-items:center;gap:7px}
  .pill{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:4px 9px;border-radius:999px}
  .pill.h{background:var(--amber-soft);color:var(--amber-deep);border:1px solid var(--amber-ring)}
  .pill.c{background:var(--violet-soft);color:var(--violet-deep);border:1px solid var(--violet-ring)}
  .pill.i{background:var(--teal-soft);color:var(--teal-deep);border:1px solid var(--teal-ring)}
  .pill.d{background:var(--blue-soft);color:var(--blue-deep);border:1px solid var(--blue-ring)}
  .pill.p{background:var(--rose-soft);color:var(--rose-deep);border:1px solid var(--rose-ring)}
  .pill.ex{background:var(--surface-3);color:var(--muted);border:1px solid var(--line)}
  .domdot{width:9px;height:9px;border-radius:50%;flex:none;box-shadow:0 0 0 2px #fff,0 1px 3px rgba(26,23,20,.2);margin-left:auto}
  .domlbl{font-size:9.5px;font-weight:800;text-transform:uppercase;letter-spacing:.05em}
  .domlegend{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:0 0 22px;font-size:10.5px;color:var(--muted);font-weight:700}
  .domlegend span{display:inline-flex;align-items:center;gap:5px}
  .domlegend i{width:9px;height:9px;border-radius:50%}
  .mem h3{margin:0;font-size:15.5px;font-weight:750;letter-spacing:-.3px;line-height:1.25;text-wrap:balance}
  .mem .body{color:var(--ink-2);font-size:13px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .tags{display:flex;flex-wrap:wrap;gap:6px}
  .tag{font-size:10.5px;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);padding:3px 8px;border-radius:7px;cursor:pointer;transition:.12s}
  .tag:hover{border-color:var(--violet-ring);color:var(--violet-deep)}
  .mem .meta{display:flex;align-items:center;gap:9px;font-size:10.5px;color:var(--muted);margin-top:1px;font-weight:600}
  .mem .meta .ln{color:var(--violet-deep);display:inline-flex;align-items:center;gap:4px}.mem .meta .ln svg{width:12px;height:12px}
  .mem .acts{display:flex;gap:6px;margin-top:auto;padding-top:8px;border-top:1px solid var(--line)}
  .iconbtn{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;color:var(--muted);transition:.13s}
  .iconbtn svg{width:16px;height:16px}.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
  .iconbtn.del:hover{background:var(--red-soft);color:var(--red)}
  .empty{text-align:center;padding:50px 20px;color:var(--muted)}
  .empty .bi{width:50px;height:50px;color:var(--violet);opacity:.5;margin:0 auto 14px}
  .empty h3{color:var(--ink-2);font-weight:750;margin:0 0 6px;font-size:18px}

  /* Bibliothèque de documents (vrais fichiers Drive, avec couverture) */
  .docgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:15px}
  .doccard{background:linear-gradient(180deg,#fff,var(--bg-2));border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-1);overflow:hidden;display:flex;flex-direction:column;transition:.16s;animation:rise .45s cubic-bezier(.22,.61,.36,1) both}
  .doccard:hover{transform:translateY(-3px);box-shadow:var(--shadow-2);border-color:var(--blue-ring)}
  .doccard .cover{width:100%;height:150px;object-fit:cover;object-position:top;display:block;background:var(--surface-2);border-bottom:1px solid var(--line)}
  .doccard .cover.ph{display:grid;place-items:center;font-size:46px}
  .doccard .dmeta{padding:10px 12px 4px}
  .doccard .dname{font-size:12.5px;font-weight:750;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .doccard .dinfo{font-size:10.5px;color:var(--muted);margin-top:3px}
  .doccard .dacts{display:flex;align-items:center;gap:6px;padding:8px 10px 10px;margin-top:auto}
  .view.quiet .doccard{animation:none}

  /* IA chat — cadre FIXE façon WhatsApp : seule la zone messages défile */
  .aiwrap{max-width:760px;display:flex;flex-direction:column;height:calc(100vh - 265px);height:calc(100dvh - 265px);min-height:300px}
  .aithread{display:flex;flex-direction:column;gap:10px;flex:1;min-height:0;overflow:auto;padding:4px;overscroll-behavior:contain}
  .bubble{max-width:85%;padding:12px 15px;border-radius:16px;font-size:14px;line-height:1.55;box-shadow:var(--shadow-1);animation:rise .3s ease both}
  .bubble.me{align-self:flex-end;background:linear-gradient(135deg,var(--amber-2),var(--amber));color:#fff;border-bottom-right-radius:6px}

  function aiContext(q){
    var wall=byType("instruction");
    var c=counts();
    function line(m){var D=domOf(m),T=TYPES[m.type]||{};return "["+(T.label||"")+" · "+D.label+" · "+fmtDate(m.date)+"] "+m.title+((m.content&&m.content!==m.title)?" — "+m.content:"")}

    if(wall.length)ctx+="RÈGLES À RESPECTER (Le Mur d'Abbas) :\n"+wall.map(function(m){return "- "+m.content}).join("\n")+"\n\n";
    var all=state.memories.slice().sort(function(a,b){return (a.date||"").localeCompare(b.date||"")});
    var full=all.map(line).join("\n");
    if(full.length<=15000){
      // mémoire compacte → l'IA reçoit TOUT, elle n'a AUCUNE excuse pour oublier
      ctx+="MÉMOIRE COMPLÈTE (chronologique) :\n"+(full||"(mémoire vide — invite Abbas à capturer ou importer ses premières pensées)");
    }else{
      var qt=norm(q);
      var scored=state.memories.map(function(m){return {m:m,s:jaccard(qt,norm(m.title+" "+m.content+" "+(m.tags||[]).join(" ")))}}).sort(function(a,b){return b.s-a.s});
      var picked=scored.filter(function(x){return x.s>0}).slice(0,15).map(function(x){return x.m});
      var recent=state.memories.slice().sort(function(a,b){return (b.date||"").localeCompare(a.date||"")});
      for(var i=0;i<recent.length&&picked.length<20;i++){if(picked.indexOf(recent[i])<0)picked.push(recent[i])}
      ctx+="MÉMOIRE (les "+picked.length+" éléments les plus pertinents et récents, sur "+c.all+" au total) :\n"+picked.map(line).join("\n");
    }

  var PROMPT='Tu es l\'archiviste de mon "second cerveau" CORTEX.\n\nIGNORE l\'interface web éventuelle (menus, « se connecter », cookies…) — ne traite que le vrai contenu. INTERDIT : les entrées « méta » (« je me suis connecté à ChatGPT »…).\n\nMENTALITÉ : LE MINIMUM d\'entrées, chacune COMPLÈTEMENT compréhensible toute seule.\n\nTRIAGE D\'ABORD : juge si ce contenu MÉRITE d\'être mémorisé. Bavardage, tests, questions banales, dépannage ponctuel → mets — dans TOUTES les sections. Ne force JAMAIS une fiche sans valeur : 0 entrée est une réponse parfaitement valable.\n\nRÈGLE DU TIROIR : si le contenu raconte ce que J\'AI fait, décidé, construit ou livré (mon travail, mes projets, mon vécu) → HISTOIRE, même si c\'est technique. CONNAISSANCE est réservé au savoir pur SANS événement personnel. Les deux sont EXCLUSIVES : remplis une SEULE des deux, jamais les deux.\n\nLA FICHE ESSENTIELLE : UNE SEULE entrée, sur UNE SEULE ligne, 1 à 3 phrases denses. INTERDIT : les listes à puces, les résumés génériques (« le contenu est classé en quatre thèmes… »), la paraphrase de structure. La fiche dit CE QUE J\'AI FAIT, AVEC QUI, et CE QUI A ÉTÉ DÉCIDÉ, avec les détails concrets qui comptent.\n\nEXEMPLE DU NIVEAU ATTENDU (histoire) : « Use cases IA BizDev Immo livrés avec Anna (leboncoin) : ① GPT Générateur Brief P&T (brief DOCX, template stable/contenu dynamique, option benchmark PPT) ; ② Assistant Suivi MEP Produit (Google Sheet central, colonne Prochaines étapes ajoutée) ; ③ Reporting hebdo KPI (export Tableau → deltas rouge/vert → analyse GPT). À part : Radar Releases avec Jérémy (Slack → n8n → Sheet). »\n\nINSTRUCTIONS : UNIQUEMENT des préférences durables que J\'EXPRIME DANS LA CONVERSATION sur la façon de travailler avec moi — SURTOUT si je me fâche ou répète une exigence (signal fort). 1 ligne impérative courte chacune, 0 à 3 maximum. JAMAIS une décision projet, JAMAIS une tâche à faire, et SURTOUT JAMAIS une règle recopiée de ce message d\'archivage. Test : la règle doit être applicable à N\'IMPORTE QUELLE future conversation (style, ton, format, méthode). Si elle ne concerne que le projet discuté → PAS une instruction, sa place est dans la fiche. EN CAS DE DOUTE, écris —. Mieux vaut — que remplir pour remplir.\n\nFormat EXACT, sans rien ajouter d\'autre :\n\n### HISTOIRE\n(la fiche essentielle sur une seule ligne, préfixée [JJ/MM/AAAA] si la date est connue. Sinon écris —)\n\n### INSTRUCTION\n(0 à 3 lignes avec tiret. Format OBLIGATOIRE avec citation : - « mes mots exacts copiés de la conversation » → règle impérative courte. Ex. : - « je veux tes réponses courtes directes et fluides » → Réponses courtes, directes, fluides — jamais de blabla. Si tu ne peux pas CITER mes mots exprimant une préférence de collaboration, écris —)\n\n### PROMPT\n(0 ou 1 texte réutilisable TEL QUEL présent dans la conversation — un vrai prompt complet, recopié fidèlement, avec tiret. Une idée, une tâche ou une description n\'est PAS un prompt. Si tu n\'as pas VU un bloc de texte recopiable, écris —. En cas de doute, écris —)\n\n### CONNAISSANCE\n(UNIQUEMENT si ### HISTOIRE est — : la fiche essentielle en 1 à 2 lignes denses, avec tiret. Si HISTOIRE est remplie, écris —)\n\nRÈGLE ABSOLUE : si HISTOIRE est remplie, CONNAISSANCE = —. TOTAL MAXIMUM : 1 fiche essentielle + 3 instructions + 1 prompt.';
  function pickDate(t){var m=(t||"").match(/^\s*\[(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})\]\s*/);if(!m)return null;var y=+m[3];if(y<100)y+=2000;var d=new Date(Date.UTC(y,(+m[2])-1,+m[1],12));if(isNaN(d.getTime()))return null;return {iso:d.toISOString(),rest:t.slice(m[0].length).trim()}}

    $("#modal").innerHTML='<h2>✨ Importer depuis une IA</h2><p class="msub">Copie le prompt → colle-le dans ChatGPT/Claude (sous ta conversation) → recolle sa réponse ici. CORTEX range tout seul.</p>'+auto+

  function chunkText(t,size,max){var out=[],pos=0;while(pos<t.length&&out.length<max){var end=Math.min(pos+size,t.length);if(end<t.length){var nl=t.lastIndexOf("\n",end);if(nl>pos+size*0.5)end=nl}out.push(t.slice(pos,end));pos=end}return {chunks:out,truncated:pos<t.length}}
  function autoImport(){
    var rawEl=$("#imp-raw"),raw=rawEl?rawEl.value.trim():"";
    if(!raw){toast("Colle le contenu brut, un lien de partage, ou dépose un fichier 📄");return}
    // Lien de partage seul (ChatGPT → Partager → copier le lien) : CORTEX va lire la page lui-même
    if(/^https?:\/\/\S+$/.test(raw)){
      var seqL=importSeq,bl=$("#autoImport");if(bl){bl.disabled=true;bl.textContent="🔗 Lecture du lien…"}
      function restL(){var b=$("#autoImport");if(b){b.disabled=false;b.textContent="Résumer et classer avec l\'IA"}}
      google.script.run
        .withSuccessHandler(function(txt){restL();if(seqL!==importSeq)return;
          var ta=$("#imp-raw");if(!ta)return;
          if(txt&&txt.length>200){ta.value=txt;toast("🔗 Page lue ("+Math.round(txt.length/1000)+" k) — je classe…");autoImport()}
          else toast("Page vide ou illisible — copie-colle le contenu à la place")})
        .withFailureHandler(function(e){restL();window.__pendingImportHash=null;if(seqL===importSeq)toast(""+((e&&e.message)||e))})
        .fetchPage(raw);
      return;
    }
    var rawHash=hashStr(norm(raw).join(" ").slice(0,4000));
    if((state.importHashes||[]).indexOf(rawHash)>=0){toast("⚠️ Déjà traité (importé ou jeté). Pour forcer : colle la réponse dans le champ 2 (méthode manuelle).");return}
    window.__pendingImportHash=rawHash;
    var ck=chunkText(raw,20000,12); /* 20k/morceau : sous les limites Groq (l'erreur 413 tuait tout import long) */
    if(ck.truncated)toast("Très long contenu : je traite les premiers ~240 000 caractères");
    var btn=$("#autoImport");if(btn)btn.disabled=true;
    var seq=importSeq,answers=[];
    function restore(){var b=$("#autoImport");if(b){b.disabled=false;b.textContent="Résumer et classer avec l\'IA"}}
    function finish(attempt){
      if(seq!==importSeq){restore();toast("Import annulé");return}
      if(answers.length>1){
        var b=$("#autoImport");if(b)b.textContent="⏳ Je consolide…";
        var joined=answers.join("\n\n");
        google.script.run
          .withSuccessHandler(function(ans){answers=[ans||""];finishNow()})
          .withFailureHandler(function(e){var msg=""+((e&&e.message)||e);
            if(/erreur (413|429|498|5\d\d)/.test(msg)&&(attempt||0)<3&&seq===importSeq){
              var b2=$("#autoImport");if(b2)b2.textContent="⏳ Pause quotas IA (50 s)… consolidation";
              setTimeout(function(){finish((attempt||0)+1)},50000);return}
            restore();window.__pendingImportHash=null;if(seq===importSeq)toast("Échec IA : "+msg)})
          .groqChat(PROMPT,"Voici plusieurs résumés PARTIELS du même contenu. Fusionne-les en UN SEUL résumé au format exact : UNE fiche essentielle (une seule ligne dense, jamais de puces) + les instructions durables (3 max, avec citations) + éventuellement UN prompt. Si au moins un résumé partiel contient une HISTOIRE remplie, la fiche essentielle DOIT être l'HISTOIRE (et CONNAISSANCE = —) :\n\n"+joined,IMPORT_MODEL);
        return;
      }
      finishNow();
    }
    function finishNow(){
      restore();
      if(seq!==importSeq){toast("Import annulé");return}
      var ta=$("#imp-text");
      if(!ta||!$("#overlay").classList.contains("show")){toast("Import annulé");return}
      ta.value=answers.join("\n");
      if(!doImport())toast("L\'IA a mal formaté — sa réponse est dans le champ 2, corrige et clique « Classer »");
    }
    function step(i,attempt){
      if(seq!==importSeq){restore();return}
      if(i>=ck.chunks.length){finish(0);return}
      var b=$("#autoImport");if(b)b.textContent="⏳ L\'IA lit… ("+(i+1)+"/"+ck.chunks.length+")";
      google.script.run
        .withSuccessHandler(function(ans){answers.push(ans||"");step(i+1,0)})
        .withFailureHandler(function(e){var msg=""+((e&&e.message)||e);
          /* quota Groq (413/429) → on attend 50 s et on RÉESSAIE le même morceau, jamais d'échec sec */
          if(/erreur (413|429|498|5\d\d)/.test(msg)&&(attempt||0)<3&&seq===importSeq){
            var b2=$("#autoImport");if(b2)b2.textContent="⏳ Pause quotas IA (50 s)… ("+(i+1)+"/"+ck.chunks.length+")";
            setTimeout(function(){step(i,(attempt||0)+1)},50000);return}
          restore();window.__pendingImportHash=null;if(seq===importSeq)toast("Échec IA : "+msg)})
        .groqChat(PROMPT,"Voici la partie "+(i+1)+"/"+ck.chunks.length+" du contenu à archiver. Ne traite QUE cette partie :\n\n"+ck.chunks[i],IMPORT_MODEL);
    }
    step(0,0);
  }
  /* ── Fichiers : PDF (pdf.js chargé à la demande) et TXT/MD ── */
  function loadPdfJs(cb){
    if(window.pdfjsLib){cb(true);return}
    var s=document.createElement("script");
    s.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
    s.onload=function(){try{window.pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"}catch(e){}cb(!!window.pdfjsLib)};
    s.onerror=function(){cb(false)};
    document.head.appendChild(s);
  }
  function extractPdf(f,done){
    loadPdfJs(function(ok){
      if(!ok){toast("Lecteur PDF indisponible (réseau) — copie-colle le texte à la place");return}
      var r=new FileReader();
      r.onload=function(){
        window.pdfjsLib.getDocument({data:new Uint8Array(r.result)}).promise.then(function(pdf){
          var texts=[],p=Promise.resolve();
          var mk=function(i){return function(){return pdf.getPage(i).then(function(pg){return pg.getTextContent()}).then(function(tc){texts.push(tc.items.map(function(it){return it.str}).join(" "))})}};
          for(var i=1;i<=pdf.numPages;i++)p=p.then(mk(i));
          p.then(function(){done(texts.join("\n\n"))}).catch(function(){toast("PDF illisible")});
        },function(){toast("PDF illisible ou protégé")});
      };
      r.readAsArrayBuffer(f);
    });
  }
  function readFileForImport(f){
    if(!f)return;
    function put(txt){txt=(txt||"").trim();
      if(!txt){toast("Aucun texte dans ce fichier (PDF scanné ? l\'OCR arrive dans une prochaine brique)");return}
      var ta=$("#imp-raw");if(ta){ta.value=txt;toast("📄 "+Math.round(txt.length/1000)+" k caractères extraits — clique « Résumer et classer »")}}
    if(/\.pdf$/i.test(f.name||"")||f.type==="application/pdf"){toast("📄 Lecture du PDF…");extractPdf(f,put)}
    else{var r=new FileReader();r.onload=function(){put(String(r.result))};r.readAsText(f,"UTF-8")}
  }
  function copyText(t,cb){
    function fb(){var ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();var ok=false;try{ok=document.execCommand("copy")}catch(e){}ta.remove();if(cb)cb(ok)}
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){if(cb)cb(true)},fb)}else fb();
  }
  function parseImport(text){
    var lines=text.split(/\r?\n/),cur=null,saw=false,buf={histoire:[],instruction:[],connaissance:[],prompt:[]};
    function head(l){var s=l.replace(/[#*_>:\-\s]/g,"").toLowerCase();if(s.length>16)return null;if(s.indexOf("histoire")===0)return "histoire";if(s.indexOf("instruction")===0)return "instruction";if(s.indexOf("connaissance")===0)return "connaissance";if(s.indexOf("prompt")===0)return "prompt";return null}
    lines.forEach(function(l){var hd=head(l);if(hd){cur=hd;saw=true;return}if(cur)buf[cur].push(l)});
    function items(a){return a.join("\n").split(/\n/).map(function(x){return x.replace(/^\s*(?:[-*•—]+|\d+[.)])?\s*/,"").trim()}).filter(function(x){return x&&x!=="—"&&x!=="-"})}
    return {histoire:items(buf.histoire),instructions:items(buf.instruction),connaissances:items(buf.connaissance),prompts:items(buf.prompt),ok:saw};
  }
  function doImport(){
    var ta=$("#imp-text"),srcEl=$("#imp-src");
    if(!ta||!srcEl||!$("#overlay").classList.contains("show"))return 0;
    var txt=ta.value.trim();if(!txt){toast("Colle d'abord la réponse de l'IA");return 0}
    var src=srcEl.value,p=parseImport(txt),added=0,now=nowISO();
    var dEl=$("#imp-date");
    if(dEl&&dEl.value){var dd=new Date(dEl.value+"T12:00:00Z");if(!isNaN(dd.getTime()))now=dd.toISOString()}
    var dups=0,merged=0;
    /* Doublon strict → rien ; info nouvelle sur fiche proche → mise à jour ; sinon création. JAMAIS de perte. */
    function addOne(type,t,tags){
      var pd=pickDate(t),body=pd?pd.rest:t,dt=pd?pd.iso:now;if(!body)return "empty";
      var nb=norm(body),sb=subjTokens(body);
      var best=null,bs=0,bestSub=null,bss=0,bshared=0;
      for(var i=0;i<state.memories.length;i++){var m=state.memories[i];if(m.type!==type)continue;
        var full=jaccard(nb,norm(m.title+" "+m.content));if(full>bs){bs=full;best=m}
        var st=subjTokens(m.content||m.title);var ss=jaccard(sb,st);
        if(ss>bss){bss=ss;bestSub=m;bshared=sharedCount(sb,st)}}
      function mergeInto(tgt){ // enrichit une fiche — si elle est pleine, on CRÉE au lieu de perdre
        if((tgt.content||"").length>=900)return false;
        tgt.content=tgt.content+"\n+ "+body;
        if(dt>(tgt.date||""))tgt.date=dt;
        tgt.example=false;merged++;return true}
      if(best&&bs>=0.85&&!digitDiff(nb,norm(best.title+" "+best.content))){dups++;return "dup"} // vrai doublon (mêmes chiffres)
      if(best&&bs>=0.65){if(mergeInto(best))return "merged"} // très proche mais différent (ex. chiffre mis à jour) → mise à jour
      else if(bestSub&&sb.length>=3&&bshared>=2&&bss>=0.5){if(mergeInto(bestSub))return "merged"} // même sujet SIGNIFICATIF (≥3 tokens, ≥2 communs)
      state.memories.push({id:uid(),type:type,title:trunc(body,52),content:body,source:src,tags:tags||[],date:dt,links:[],domain:autoDomain(body)});added++;return "added"}
    var mainTxt=(p.histoire||[])[0]||((p.connaissances||[]).slice(0,2).join("\n")||null);
    var mainType=(p.histoire||[])[0]?"histoire":"connaissance";
    if(mainTxt)addOne(mainType,mainTxt);
    var pr=(p.prompts||[])[0];
    if(pr)addOne("prompt",pr,["prompt"]);
    /* les préférences durables (souvent exprimées en se fâchant) méritent d'être gardées — 3 max.
       Garde-fou : une instruction DOIT citer mes mots (« … ») — sinon c'est du remplissage, on jette. */
    (p.instructions||[]).filter(function(ins){return /«.+»/.test(ins)}).slice(0,3).forEach(function(ins){addOne("instruction",ins)});
    function keepHash(){if(window.__pendingImportHash){state.importHashes=state.importHashes||[];state.importHashes.push(window.__pendingImportHash);window.__pendingImportHash=null}}
    if(!added&&!merged&&dups){window.__pendingImportHash=null;toast("Rien de nouveau : déjà dans ta mémoire ✓");closeModal();return dups}
    if(!added&&!merged&&p.ok){keepHash();state.savedAt=nowISO();persistLocal();cloudSave();toast("🗑️ Rien d'important à retenir — conversation jetée ✓");closeModal();return 1}
    if(!added&&!merged){window.__pendingImportHash=null;toast("Format non reconnu — vérifie les titres ### HISTOIRE / INSTRUCTION / CONNAISSANCE");return 0}
    keepHash();
    save();closeModal();state.view="memoire";state.type="all";render();
    var parts=[];
    if(added)parts.push(added+" fiche"+(added>1?"s":"")+" ajoutée"+(added>1?"s":""));
    if(merged)parts.push(merged+" fiche"+(merged>1?"s":"")+" existante"+(merged>1?"s":"")+" enrichie"+(merged>1?"s":""));
    if(dups)parts.push(dups+" doublon"+(dups>1?"s":"")+" ignoré"+(dups>1?"s":""));
    toast("✓ "+parts.join(" · "));
    return added+merged;
  }

    state.memories.push({id:uid(),type:"connaissance",title:title,content:v,source:"capture",tags:[],date:nowISO(),links:[],domain:autoDomain(v)});save();$("#capt").value="";toast("Capturé ✓ dans Connaissances");render()}
  function delMemory(id){var m=state.memories.filter(function(x){return x.id===id})[0];if(!m)return;if(!confirm('Supprimer « '+m.title+' » ? Définitif.'))return;
    state.memories=state.memories.filter(function(x){return x.id!==id});state.memories.forEach(function(x){x.links=(x.links||[]).filter(function(l){return l!==id})});save();render();toast("Supprimé")}
  function download(n,t,ty){var b=new Blob([t],{type:ty||"text/plain;charset=utf-8"}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download=n;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},1500)}
  function exportJson(){download("cortex-sauvegarde.json",JSON.stringify({memories:state.memories,savedAt:nowISO()},null,2),"application/json");toast("Sauvegarde téléchargée")}
  function buildHistMd(){var s=byType("histoire").slice().sort(function(a,b){return (a.date||"").localeCompare(b.date||"")}),md="# L'Histoire d'Abbas\n\n_Un livre qui s'écrit tout seul, depuis CORTEX._\n",lc="";s.forEach(function(m){var c=monthYear(m.date);if(c!==lc){md+="\n## "+c+"\n\n";lc=c}var D=domOf(m);md+="**"+fmtDate(m.date)+" · "+D.emoji+" "+D.label+(m.source?" · "+m.source:"")+"** — "+m.content+"\n\n"});return md}
  function exportHist(){download("histoire.md",buildHistMd(),"text/markdown;charset=utf-8");toast("histoire.md téléchargé")}
  function importJson(f){var r=new FileReader();r.onload=function(){try{var d=JSON.parse(r.result);if(d.memories&&d.memories.length){state.memories=d.memories;migrate();save();render();toast("Importé ✓")}else toast("Fichier vide/invalide")}catch(e){toast("Fichier illisible")}};r.readAsText(f)}

  function bind(){
    var q=$("#q");if(q)q.addEventListener("input",function(){var pos=q.selectionStart;window.__quiet=true;state.q=q.value;render();var n=$("#q");if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}}});
    var add=$("#addBtn");if(add)add.addEventListener("click",function(){openModal(null,add.dataset.type||null)});
    [["#importBtn"],["#importBtn2"]].forEach(function(p){var e=$(p[0]);if(e)e.addEventListener("click",openImport)});
    var bg=$("#burger");if(bg)bg.addEventListener("click",function(){$("#side").classList.toggle("open")});
    [["#exportHist",exportHist],["#expJson",exportJson],["#expHist2",exportHist]].forEach(function(p){var e=$(p[0]);if(e)e.addEventListener("click",p[1])});
    var imp=$("#impFile");if(imp)imp.addEventListener("change",function(){if(imp.files[0])importJson(imp.files[0])});
    var ce=$("#clearEx");if(ce)ce.addEventListener("click",function(){state.memories=state.memories.filter(function(m){return !m.example});save();render();toast("Exemples effacés")});
    var wp=$("#wipe");if(wp)wp.addEventListener("click",function(){if(confirm("Tout effacer ? Définitif.")){state.memories=[];save();render();toast("Mémoire vidée")}});
    document.querySelectorAll("[data-type]").forEach(function(b){if(b.classList.contains("chip"))b.addEventListener("click",function(){window.__quiet=true;state.type=b.dataset.type;state.tag=null;render()})});
    document.querySelectorAll("[data-go]").forEach(function(b){b.addEventListener("click",function(){window.__quiet=false;state.view=b.dataset.go;window.scrollTo(0,0);render()})});
    var ct=$("[data-cleartag]");if(ct)ct.addEventListener("click",function(){window.__quiet=true;state.tag=null;render()});
    document.querySelectorAll("[data-histdom]").forEach(function(b){b.addEventListener("click",function(){window.__quiet=true;state.histDom=b.dataset.histdom;render()})});
    var ais=$("#aiSend");if(ais)ais.addEventListener("click",function(){askAI()});
    var aii=$("#aiInput");if(aii)aii.addEventListener("keydown",function(e){if(e.key==="Enter")askAI()});
    document.querySelectorAll("[data-aiq]").forEach(function(b){b.addEventListener("click",function(){askAI(b.dataset.aiq)})});
    var ks=$("#keySave");if(ks)ks.addEventListener("click",saveKey);
    var ki=$("#keyInput");if(ki)ki.addEventListener("keydown",function(e){if(e.key==="Enter")saveKey()});
    var kc=$("#keyClear");if(kc)kc.addEventListener("click",clearKey);
    document.querySelectorAll("[data-tag]").forEach(function(t){t.addEventListener("click",function(e){e.stopPropagation();window.__quiet=true;state.tag=t.dataset.tag;state.type="all";state.view="memoire";render()})});
    document.querySelectorAll("[data-edit]").forEach(function(b){b.addEventListener("click",function(){openModal(b.dataset.edit)})});
    document.querySelectorAll("[data-del]").forEach(function(b){b.addEventListener("click",function(){delMemory(b.dataset.del)})});
    var du=$("#docUp");if(du)du.addEventListener("change",function(){if(du.files&&du.files.length){uploadDocs(du.files);du.value=""}});
    document.querySelectorAll("[data-docdel]").forEach(function(b){b.addEventListener("click",function(){
      if(!confirm("Mettre ce fichier à la corbeille Drive ? (récupérable 30 jours)"))return;
      google.script.run.withSuccessHandler(function(){state.docs=null;render();toast("Fichier mis à la corbeille")})
        .withFailureHandler(function(e){toast("Échec : "+((e&&e.message)||e))}).deleteDoc(b.dataset.docdel);
    })});
    var sv=$(".synmap");if(sv){var ns=sv.querySelectorAll(".syn-node"),ls=sv.querySelectorAll(".syn-link");ns.forEach(function(n){n.addEventListener("mouseenter",function(){var id=n.getAttribute("data-edit"),nb={};nb[id]=1;sv.classList.add("focus");ls.forEach(function(l){var a=l.getAttribute("data-a"),b=l.getAttribute("data-b"),on=(a===id||b===id);l.classList.toggle("hot",on);if(on){nb[a]=1;nb[b]=1}});ns.forEach(function(o){o.classList.toggle("hot",!!nb[o.getAttribute("data-edit")])})});n.addEventListener("mouseleave",function(){sv.classList.remove("focus");ns.forEach(function(o){o.classList.remove("hot")});ls.forEach(function(l){l.classList.remove("hot")})})})}
  }
  document.querySelectorAll("#nav button").forEach(function(b){b.addEventListener("click",function(){window.__quiet=false;state.view=b.dataset.view;state.type="all";state.tag=null;state.histDom="all";$("#side").classList.remove("open");window.scrollTo(0,0);render()})});
  $("#captSend").addEventListener("click",quickCapture);
  var recB=$("#recBtn");if(recB)recB.addEventListener("click",function(){if(recRef)stopRec();else startRec()});
  var attF=$("#attachAudio");if(attF)attF.addEventListener("change",function(){if(attF.files&&attF.files[0]){transcribeFile(attF.files[0]);attF.value=""}});
  var rfF=$("#recFallback");if(rfF)rfF.addEventListener("change",function(){if(rfF.files&&rfF.files[0]){transcribeFile(rfF.files[0]);rfF.value=""}});
  $("#capt").addEventListener("keydown",function(e){if(e.key==="Enter")quickCapture()});
  $("#overlay").addEventListener("click",function(e){if(e.target===$("#overlay"))closeModal()});
  document.addEventListener("keydown",function(e){if(e.key==="Escape")closeModal()});
  load();render();cloudInit();
})();
</script>
