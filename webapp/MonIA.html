<style>
#monia{height:100%;display:flex;flex-direction:column;min-height:0}.ma-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:9px}.ma-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px;flex:1;min-height:0}.ma-chat{display:flex;flex-direction:column;min-height:0;background:#fff;border:1px solid var(--line);border-radius:var(--r-xl);overflow:hidden}.ma-top{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.ma-current{display:flex;gap:9px;align-items:center}.ma-logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--violet-2),var(--violet));color:#fff;display:grid;place-items:center;font-weight:900}.ma-current b{display:block;font-size:12px}.ma-current small{display:block;color:var(--muted);font-size:9px}.ma-thread{flex:1;min-height:0;overflow:auto;padding:15px}.ma-msg{max-width:82%;padding:11px 13px;border-radius:14px;margin-bottom:9px;font-size:12.5px;white-space:pre-wrap}.ma-msg.user{margin-left:auto;background:linear-gradient(135deg,var(--violet-2),var(--violet));color:#fff;border-bottom-right-radius:4px}.ma-msg.ai{border:1px solid var(--line);background:#fff;border-bottom-left-radius:4px}.ma-msg.err{background:var(--red-soft);color:var(--red)}.ma-compose{padding:10px;border-top:1px solid var(--line)}.ma-files{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px}.ma-file{font-size:9px;padding:4px 7px;border:1px solid var(--line);border-radius:99px}.ma-row{display:grid;grid-template-columns:auto 1fr auto;gap:7px}.ma-row textarea{resize:none;min-height:42px;max-height:110px;border:1px solid var(--line-2);border-radius:12px;padding:10px;outline:0}.ma-row textarea:focus{border-color:var(--violet)}.ma-attach,.ma-send{width:42px;height:42px;border-radius:12px;display:grid;place-items:center}.ma-attach{background:var(--surface-2);border:1px solid var(--line)}.ma-send{background:linear-gradient(135deg,var(--amber-2),var(--amber));color:#fff}.ma-side{min-height:0;overflow:auto}.ma-panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:9px}.ma-panel h2{font-size:12px;margin:0}.ma-panel p{font-size:9.5px;color:var(--muted);margin:3px 0 8px}.ma-model{display:flex;align-items:center;gap:7px;width:100%;padding:7px;border:1px solid var(--line);border-radius:10px;margin-top:6px;text-align:left}.ma-model.active{background:var(--violet-soft);border-color:var(--violet-ring)}.ma-model i{font-style:normal;width:28px;height:28px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font-size:9px;font-weight:900}.ma-model span{flex:1;min-width:0}.ma-model b{display:block;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ma-model small{display:block;font-size:8px;color:var(--muted)}.ma-dot{width:7px;height:7px;border-radius:50%;background:var(--green)}.ma-note{font-size:9px;color:var(--amber-deep);background:var(--amber-soft);border:1px solid var(--amber-ring);padding:8px;border-radius:9px;margin-top:8px}.ma-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.ma-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}@media(max-width:900px){.ma-layout{grid-template-columns:1fr}.ma-side{display:none}.ma-msg{max-width:92%}.ma-head .lead{display:none}}
</style>
<script>
(function(){'use strict';var STORE='cortex_noyau_v1',TKEY='cortex_mon_ia_thread_v1',AKEY='cortex_mon_ia_active_v1',DKEY='cortex_mon_ia_docs_v1',cons=[],activeId='',thread=[],docs=[],busy=false;
function $(s,r){return (r||document).querySelector(s)}function $$(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))}function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}function toast(m){var t=$('#toast');if(!t)return;t.textContent=m;t.classList.add('show');clearTimeout(window.__mat);window.__mat=setTimeout(function(){t.classList.remove('show')},2400)}function read(k,d){try{return JSON.parse(localStorage.getItem(k)||'')||d}catch(e){return d}}function save(){localStorage.setItem(TKEY,JSON.stringify(thread.slice(-40)));localStorage.setItem(AKEY,activeId);localStorage.setItem(DKEY,JSON.stringify(docs.slice(-10)))}function mem(){var d=read(STORE,{});return d.memories||[]}function tok(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(function(x){return x.length>2})}function sim(q,t){var a={},b={},u={},n=0;tok(q).forEach(function(x){a[x]=u[x]=1});tok(t).forEach(function(x){b[x]=u[x]=1});Object.keys(a).forEach(function(x){if(b[x])n++});return n/(Object.keys(u).length||1)}function rag(q){var m=mem(),ins=m.filter(function(x){return x.type==='instruction'}),r=m.filter(function(x){return x.type!=='instruction'}).map(function(x){return {m:x,s:sim(q,(x.title||'')+' '+(x.content||''))}}).sort(function(a,b){return b.s-a.s}).slice(0,18).map(function(x){return x.m});return 'UTILISATEUR: Abbas Mistrah.\nINSTRUCTIONS PERMANENTES:\n'+ins.map(function(x){return '- '+x.content}).join('\n')+'\n\nMEMOIRE RAG:\n'+r.map(function(x){return '['+x.type+'] '+x.title+' — '+(x.content||'')}).join('\n')}function dctx(q){var c=[];docs.forEach(function(d){(d.chunks||[]).forEach(function(x,i){c.push({n:d.name,t:x,s:sim(q,x),i:i})})});c.sort(function(a,b){return b.s-a.s});return c.slice(0,8).map(function(x){return '['+x.n+' '+(x.i+1)+'] '+x.t}).join('\n\n').slice(0,28000)}function act(){for(var i=0;i<cons.length;i++)if(cons[i].id===activeId)return cons[i];return cons[0]||null}function logo(c){if(!c)return'IA';if(c.preset==='openclaw')return'CL';if(c.preset==='hermes')return'H';if(c.type==='gemini')return'✦';if(c.type==='anthropic')return'A';if(c.type==='groq')return'G';return(c.name||'IA').slice(0,2).toUpperCase()}
function loadCons(){google.script.run.withSuccessHandler(function(s){try{cons=JSON.parse(s||'[]')}catch(e){cons=[]}if(!activeId&&cons[0])activeId=cons[0].id;if(activeId&&!act())activeId=cons[0]?cons[0].id:'';save();if($('#monia'))render()}).withFailureHandler(function(){cons=[];if($('#monia'))render()}).listAiConnections()}
function open(){document.body.classList.add('chatlock');$$('#nav button').forEach(function(b){b.classList.remove('active')});var n=$('#nav button[data-view="ia"]');if(n)n.classList.add('active');var cp=$('#composer');if(cp)cp.classList.add('hide');var v=$('#view');v.className='view';v.innerHTML='<div id="monia"></div>';render()}
function models(){if(!cons.length)return'<div class="empty" style="padding:12px">Aucune IA connectée.</div>';return cons.map(function(c){return'<button class="ma-model '+(c.id===activeId?'active':'')+'" data-ma="'+esc(c.id)+'"><i>'+esc(logo(c))+'</i><span><b>'+esc(c.name)+'</b><small>'+esc(c.type+' · '+c.model)+'</small></span><em class="ma-dot"></em></button>'}).join('')}
function msgs(){if(!thread.length)return'<div class="empty"><h3>Ton IA est prête</h3><p>Ajoute une connexion puis commence.</p></div>';return thread.map(function(m){return'<div class="ma-msg '+(m.role==='user'?'user':m.error?'err':'ai')+'">'+esc(m.text)+'</div>'}).join('')+(busy?'<div class="ma-msg ai">CORTEX réfléchit…</div>':'')}
function render(){var r=$('#monia'),c=act();if(!r)return;r.innerHTML='<div class="ma-head"><div><span class="eyebrow">CORTEX · MON IA</span><h1>Parle avec le modèle de ton choix</h1><p class="lead">Mémoire, règles et conversation restent dans CORTEX.</p></div><button class="btn primary" id="maAdd">＋ Ajouter une IA</button></div><div class="ma-layout"><section class="ma-chat"><div class="ma-top"><div class="ma-current"><div class="ma-logo">'+esc(logo(c))+'</div><div><b>'+esc(c?c.name:'Aucune IA')+'</b><small>RAG CORTEX actif · conversation conservée</small></div></div><span class="pill c">CORTEX 0 €</span></div><div class="ma-thread" id="maThread">'+msgs()+'</div><div class="ma-compose"><div class="ma-files">'+docs.map(function(d){return'<span class="ma-file">📄 '+esc(d.name)+'</span>'}).join('')+'</div><div class="ma-row"><label class="ma-attach">📎<input id="maFile" type="file" multiple hidden accept=".pdf,.txt,.md,.html,.csv,.json,audio/*"></label><textarea id="maInput" placeholder="Écris à ton IA…"></textarea><button class="ma-send" id="maSend">→</button></div></div></section><aside class="ma-side"><div class="ma-panel"><div style="display:flex;justify-content:space-between"><div><h2>Mes modèles et agents</h2><p>Clé personnelle ou endpoint HTTP.</p></div><button class="btn violet sm" id="maAdd2">＋</button></div>'+models()+'<div class="ma-note">OpenClaw et Hermes se branchent via une passerelle HTTP accessible. Une API externe peut être payante; CORTEX ne facture rien.</div></div><div class="ma-panel"><h2>Contexte automatique</h2><p>'+mem().length+' fiches mémoire · instructions permanentes · documents découpés · historique inter-modèles.</p></div></aside></div>';bind();setTimeout(function(){var t=$('#maThread');if(t)t.scrollTop=t.scrollHeight},0)}
function bind(){$('#maAdd').onclick=modal;$('#maAdd2').onclick=modal;$$('[data-ma]').forEach(function(b){b.onclick=function(){activeId=b.getAttribute('data-ma');thread.push({role:'ai',text:'Modèle changé. La mémoire et la conversation sont conservées.'});save();render()}});$('#maSend').onclick=send;$('#maInput').onkeydown=function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};$('#maFile').onchange=function(){files(this.files)}}
function split(s){var o=[],z=7500;for(var i=0;i<s.length;i+=7000)o.push(s.slice(i,i+z));return o.slice(0,200)}function files(list){Array.prototype.slice.call(list||[]).forEach(function(f){if(f.size>40*1024*1024){toast('Fichier trop lourd pour Apps Script: '+f.name);return}if(/\.pdf$/i.test(f.name)){toast('PDF: utilise la bibliothèque Documents actuelle ou colle le texte dans cette version.');return}if(/^audio\//.test(f.type)){var r=new FileReader();r.onload=function(){google.script.run.withSuccessHandler(function(t){docs.push({name:f.name,chunks:split(t||'')});save();render();toast('Audio transcrit ✓')}).withFailureHandler(function(e){toast((e&&e.message)||e)}).groqTranscribe(String(r.result).split(',')[1],f.type,f.name)};r.readAsDataURL(f);return}var rd=new FileReader();rd.onload=function(){docs.push({name:f.name,chunks:split(String(rd.result||''))});save();render();toast('Document indexé ✓')};rd.readAsText(f,'UTF-8')})}
function send(){var i=$('#maInput'),q=i.value.trim(),c=act();if(!q||busy)return;if(!c){modal();return}thread.push({role:'user',text:q});busy=true;i.value='';save();render();var sys='Tu es CORTEX, le second cerveau d\'Abbas. Réponds en français, direct et fiable. Respecte les instructions. N\'invente rien.\n\n'+rag(q)+'\n\nDOCUMENTS:\n'+dctx(q);var req={system:sys,messages:thread.slice(-14).map(function(m){return{role:m.role==='ai'?'assistant':'user',content:m.text}}),sessionId:'cortex-'+activeId,maxTokens:2200,temperature:.25};google.script.run.withSuccessHandler(function(a){thread.push({role:'ai',text:String(a||'')});busy=false;save();render()}).withFailureHandler(function(e){thread.push({role:'ai',text:'⚠️ '+((e&&e.message)||e),error:true});busy=false;save();render()}).cortexAiChat(activeId,JSON.stringify(req))}
function modal(){var m=$('#modal'),o=$('#overlay');m.innerHTML='<h2>Ajouter une IA ou un agent</h2><p class="msub">La clé reste dans UserProperties, jamais dans GitHub.</p><div class="ma-grid"><div class="field"><label>Connexion</label><select id="mt"><option value="groq">Groq</option><option value="openai">API compatible OpenAI</option><option value="gemini">Gemini</option><option value="anthropic">Anthropic</option><option value="agent">Agent HTTP</option></select></div><div class="field"><label>Préréglage</label><select id="mp"><option value="">Standard</option><option value="openclaw">OpenClaw</option><option value="hermes">Hermes Agent</option></select></div></div><div class="ma-grid"><div class="field"><label>Nom</label><input id="mn"></div><div class="field"><label>Modèle</label><input id="mm"></div></div><div class="field"><label>Endpoint</label><input id="me"></div><div class="field"><label>Clé / token</label><input id="mk" type="password"></div><div class="ma-actions"><button class="btn ghost" id="mc">Annuler</button><button class="btn violet" id="mx">Tester</button><button class="btn primary" id="ms">Ajouter</button></div>';o.classList.add('show');function v(){return{type:$('#mt').value,preset:$('#mp').value,name:$('#mn').value.trim(),model:$('#mm').value.trim(),endpoint:$('#me').value.trim(),apiKey:$('#mk').value.trim()}}function def(){var t=$('#mt').value,p=$('#mp').value;if(p==='openclaw'){$('#mt').value='agent';$('#mn').value='OpenClaw';$('#mm').value='openclaw'}else if(p==='hermes'){$('#mt').value='agent';$('#mn').value='Hermes Agent';$('#mm').value='hermes'}else if(t==='groq'){$('#mn').value=$('#mn').value||'Groq';$('#mm').value=$('#mm').value||'llama-3.3-70b-versatile';$('#me').value=$('#me').value||'https://api.groq.com/openai/v1'}}$('#mt').onchange=def;$('#mp').onchange=def;def();$('#mc').onclick=function(){o.classList.remove('show')};$('#mx').onclick=function(){toast('Test…');google.script.run.withSuccessHandler(function(){toast('Connexion valide ✓')}).withFailureHandler(function(e){toast((e&&e.message)||e)}).testAiConnection(JSON.stringify(v()))};$('#ms').onclick=function(){var x=v();if(!x.name||!x.model){toast('Nom et modèle obligatoires');return}google.script.run.withSuccessHandler(function(s){o.classList.remove('show');try{activeId=JSON.parse(s).id}catch(e){}loadCons();toast('IA ajoutée ✓')}).withFailureHandler(function(e){toast((e&&e.message)||e)}).saveAiConnection(JSON.stringify(x))}}
function install(){var n=$('#nav button[data-view="ia"]');if(!n)return;var b=$('b',n);if(b)b.textContent='Mon IA';var c=n.cloneNode(true);n.parentNode.replaceChild(c,n);c.onclick=function(e){e.preventDefault();open()};thread=read(TKEY,[]);docs=read(DKEY,[]);activeId=localStorage.getItem(AKEY)||'';if(window.google&&google.script&&google.script.run)loadCons()}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',function(){setTimeout(install,0)});else setTimeout(install,0)})();
</script>
